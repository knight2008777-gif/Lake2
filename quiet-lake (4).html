<h1>静寂の湖</h1>
<p>スマホを持って動かすと、水面が波立ちます。<br>じっと止まると、水が澄んで、水面に星が出てきます。<br>星が出てきた順番になぞろう。<br>パソコンではマウスで揺らし、ドラッグでなぞります。</p>

const CN=[
{n:'カシオペア座',d:'Wの形が目印。北極星を探す手がかりになる。ギリシャ神話の王妃カシオペアの姿。北の空に一年中見える。Wの両はしの線をのばした交点と真ん中の星を結び、5倍のばすと北極星。神話では、自慢が過ぎて椅子にしばられ、空をまわり続ける。',p:[[0,.25],[.22,.75],[.5,.4],[.78,.8],[1,.2]],l:[[0,1],[1,2],[2,3],[3,4]],b:[2]},
